version: '3.9'

services:
  postgres:
    image: postgres:17
    container_name: postgres_cs2
    restart: always
    environment:
      POSTGRES_DB: cs2scout
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"

  app:
    build: .
    container_name: cs2scout_app
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cs2scout
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 123456
